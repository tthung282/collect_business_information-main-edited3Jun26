<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>adaptasia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #fff8e1, #f3e5f5, #e1bee7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px 40px;
    }

    .container {
      background: #ffffffee;
      padding: 2rem;
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
    }

    .company-name {
      font-size: 1rem;
      font-weight: bold;
      color: #6a1b9a;
    }

    .loading-text {
      font-size: 1.3rem;
      color: #444;
      margin-bottom: 1rem;
    }

    .progress-bar-container {
      width: 100%;
      height: 20px;
      background-color: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #e63946;
      animation: loading 5s linear forwards;
    }

    @keyframes loading {
      from { width: 0%; }
      to { width: 100%; }
    }
  </style>

  <script>
    // Redirect after 5 seconds

    let score1 = Number(localStorage.getItem("question1") || 0)
    let score2 = Number(localStorage.getItem("question2") || 0)
    let score3 = Number(localStorage.getItem("question3") || 0)
    let score4 = Number(localStorage.getItem("question4") || 0)
    let score5 = Number(localStorage.getItem("question5") || 0)
    let total_score = score1 + score2 + score3 + score4 + score5
    
// If total score is 5-8, show Step 8(a)
// If total score is 9-12, show Step 8(b)
// If total score is 13-16, show Step 8(c)
// If total score is 17-20, show Step 8(d)
    window.onload = function () {
      const loading = document.getElementById("loading");
      const scriptURL = "https://script.google.com/macros/s/AKfycbz4pv_VZchz4c9g5VlQZr4BQj1nxGWZwwPxhw62SnBZwgdrWBHieqJ7mhsx5k6NWPMo/exec";
      
        // Collect all answers from localStorage
        const answers = new FormData();
      
        answers.append("name", localStorage.getItem("name") || "");
        answers.append("email", localStorage.getItem("email") || "");
        answers.append("phone", localStorage.getItem("phone") || "");
        answers.append("industry", localStorage.getItem("industry") || "");
        answers.append("sellBusiness", localStorage.getItem("sellBusiness") || "");
        answers.append("question1", localStorage.getItem("question1") || "");
        answers.append("question2", localStorage.getItem("question2") || "");
        answers.append("question3", localStorage.getItem("question3") || "");
        answers.append("question4", localStorage.getItem("question4") || "");
        answers.append("question5", localStorage.getItem("question5") || "");
    
        fetch(scriptURL, {
            method: "POST",
            body: answers
          })
          .then(res => res.json())
          .then(res => {
            console.log("Success!", res);
            // go to next page after saving
            
        setTimeout(function () {
          window.location.href = "index7.html";
        }, 2000);
          })
          .catch(err =>{
            alert("Error: " + err);
          });

    };
  </script>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo" class="logo" />
    <div class="company-name">adaptasia</div>

    <div class="loading-text">Checking your answers... Please wait</div>

    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>

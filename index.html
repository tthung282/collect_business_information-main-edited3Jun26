<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>adaptasia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #fff8e1, #f3e5f5, #e1bee7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px 40px;
    }

    .container {
      background: #ffffffee;
      padding: 2rem;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
    }

    .company-name {
      font-size: 1.0rem;
      font-weight: bold;
      color: #6a1b9a;
    }

    .headline {
      font-size: 2rem;
      font-weight: bold;
      color: #d6336c;
    }

    .description {
      font-size: 1.1rem;
      color: #444;
      max-width: 600px;
    }

    .main-image {
      width: 100%;
      max-width: 350px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
      text-align: left;
    }

    label {
      font-weight: bold;
      margin-bottom: 0.3rem;
      display: block;
      color: #6a1b9a;
    }

    input, select {
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      width: 100%;
    }

    .btn {
      background-color: #e63946;
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(230, 57, 70, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      opacity: 0.6;
      text-align: center;
    }

    .btn.enabled {
      opacity: 1;
      cursor: pointer;
    }

    .btn:hover.enabled {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(230, 57, 70, 0.6);
    }

    @media (max-width: 600px) {
      .headline {
        font-size: 1.5rem;
      }

      .description {
        font-size: 1rem;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo" class="logo" />
    <div class="company-name">adaptasia</div>
    <div class="headline">How much is my business worth? Take quiz</div>
    <p class="description">Answer 5 simple questions and find out</p>
    <img src="main.JPG" alt="Spiritual Image" class="main-image" />

    <!-- Form Start -->
    <form id="quizForm">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />

      <button type="submit" id="submitBtn" class="btn" disabled>Take Quiz</button>
    </form>
    <!-- Form End -->
  </div>

  <script>
    const form = document.getElementById('quizForm');
    const submitBtn = document.getElementById('submitBtn');

    const fields = ['name', 'email'].map(id => document.getElementById(id));

    function checkFormValidity() {
      const allFilled = fields.every(field => field.value.trim() !== '');
      submitBtn.disabled = !allFilled;
      if (allFilled) {
        submitBtn.classList.add('enabled');
      } else {
        submitBtn.classList.remove('enabled');
      }
    }

    fields.forEach(field => field.addEventListener('input', checkFormValidity));
  
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const formData = new FormData(form);

      const name = formData.get("name");
      localStorage.setItem("name", name);

      const email = formData.get("email");
      localStorage.setItem("email", email);

      // Go to next page
      window.location.href = "index2.html";
    });
  </script>
</body>
</html>
